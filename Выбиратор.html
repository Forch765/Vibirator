<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Выбиратор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap">
<style>
/* Layout: одна узкая колонка по центру. Поле ввода, облачка вариантов, переключатель, кнопка, карточка результата, ряд цветов. Всё круглое. */
:root {
  --h: 60;
  --s: 8;
  --ah: 155;
  --bg: hsl(var(--h) calc(var(--s) * 1%) 94.5%);
  --surface: #FFFFFF;
  --fg: #16181A;
  --muted: #7A7F83;
  --line: hsl(var(--h) calc(var(--s) * 0.8%) 88%);
  --btn: #16181A;
  --on-btn: #FFFFFF;
  --accent: hsl(var(--ah) 60% 38%);
  --font: "Manrope", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: hsl(var(--h) calc(var(--s) * 0.5%) 8%);
    --surface: hsl(var(--h) calc(var(--s) * 0.5%) 12%);
    --fg: #F1F2F0; --muted: #8B9190;
    --line: hsl(var(--h) calc(var(--s) * 0.5%) 19%);
    --btn: #F1F2F0; --on-btn: #121413;
    --accent: hsl(var(--ah) 58% 62%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: hsl(var(--h) calc(var(--s) * 0.5%) 8%);
  --surface: hsl(var(--h) calc(var(--s) * 0.5%) 12%);
  --fg: #F1F2F0; --muted: #8B9190;
  --line: hsl(var(--h) calc(var(--s) * 0.5%) 19%);
  --btn: #F1F2F0; --on-btn: #121413;
  --accent: hsl(var(--ah) 58% 62%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 440px; margin: 0 auto; display: grid; gap: 20px; }
h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.02em; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 15px; }

form { display: flex; gap: 8px; }
#inp {
  flex: 1; min-width: 0; font: inherit; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 14px 20px; outline: none;
}
#inp::placeholder { color: var(--muted); }
#inp:focus { border-color: var(--fg); }
#add {
  flex: none; width: 52px; height: 52px; border: 0; border-radius: 50%;
  background: var(--btn); color: var(--on-btn); font: inherit; font-size: 26px; font-weight: 500; line-height: 1;
  cursor: pointer; touch-action: manipulation;
}

.meta { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; min-height: 24px; }
#clear { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; padding: 4px 8px; border-radius: 999px; cursor: pointer; }
#clear:hover { color: var(--fg); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -8px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 6px 6px 16px; font-size: 15px; transition: opacity .15s ease;
}
.chip span { min-width: 0; overflow-wrap: anywhere; }
.chip button {
  flex: none; width: 26px; height: 26px; border: 0; border-radius: 50%; background: transparent;
  color: var(--muted); font: inherit; font-size: 18px; line-height: 1; cursor: pointer;
}
.chip button:hover { background: var(--bg); color: var(--fg); }
.chip[data-win="1"] { border-color: var(--accent); }
.chip[data-used="1"] { opacity: .4; }

.switch {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  font: inherit; font-size: 15px; color: var(--fg); background: none; border: 0; padding: 0; cursor: pointer;
  touch-action: manipulation;
}
.track { flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s ease; }
.track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s ease;
}
.switch[aria-checked="true"] .track { background: var(--accent); }
.switch[aria-checked="true"] .track::after { transform: translateX(18px); }

#go {
  width: 100%; border: 0; border-radius: 999px; padding: 18px; font: inherit; font-weight: 700; font-size: 18px;
  background: var(--btn); color: var(--on-btn); cursor: pointer; touch-action: manipulation;
  transition: transform .08s ease, opacity .15s ease;
}
#go:active:not(:disabled) { transform: scale(.98); }
#go:disabled { opacity: .35; cursor: not-allowed; }

.result {
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
  padding: 28px 20px; min-height: 150px; display: grid; place-content: center; gap: 8px; text-align: center;
}
.result .label { font-size: 13px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.result .value { font-size: clamp(26px, 8vw, 36px); font-weight: 800; letter-spacing: -.02em; overflow-wrap: anywhere; }
.result .hint { font-size: 14px; color: var(--muted); }
.result .hint:empty { display: none; }
.result[data-state="idle"] .value { font-size: 17px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.result[data-state="spin"] .value { color: var(--muted); }
.result[data-state="done"] { border-color: var(--accent); }
.result[data-state="done"] .label { color: var(--accent); }
.result[data-state="done"] .value { animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }

.pals { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.pals .row { display: flex; gap: 10px; }
.pal {
  width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
  background: hsl(var(--sw) 60% 52%); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px transparent;
  touch-action: manipulation; transition: box-shadow .12s ease;
}
.pal[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fg); }

:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) {
  .result .value { animation: none !important; }
  #go, .track, .track::after, .chip, .pal { transition: none; }
}
</style>

<div class="wrap">
  <header>
    <h1>Выбиратор</h1>
    <p class="sub">Впишите варианты, остальное сделает случай.</p>
  </header>

  <form id="form" autocomplete="off">
    <input id="inp" type="text" maxlength="60" placeholder="Новый вариант" aria-label="Новый вариант" enterkeyhint="done">
    <button id="add" type="submit" aria-label="Добавить вариант">+</button>
  </form>

  <div class="meta"><span id="count"></span><button id="clear" type="button">Очистить</button></div>
  <div class="chips" id="chips"></div>

  <button class="switch" id="norep" type="button" role="switch" aria-checked="false">
    <span class="track"></span><span>Не повторять выпавший</span>
  </button>

  <button id="go" type="button">Выбрать</button>

  <div class="result" id="res" data-state="idle" aria-live="polite">
    <div class="label" id="label">Результат</div>
    <div class="value" id="val">Нажмите «Выбрать»</div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="pals"><span>Цвет</span><div class="row" id="pals"></div></div>
</div>

<script>
(function () {
  var KEY = 'vybiratol-v2';
  var OLD_KEY = 'vybiratol-v1';
  var MAX = 50;
  var PALS = [
    { id: 'graphite', name: 'Графит', h: 60, s: 8, ah: 155 },
    { id: 'lime', name: 'Лайм', h: 95, s: 24, ah: 100 },
    { id: 'sky', name: 'Небо', h: 210, s: 30, ah: 212 },
    { id: 'peach', name: 'Персик', h: 20, s: 45, ah: 14 },
    { id: 'lilac', name: 'Сирень', h: 270, s: 24, ah: 268 }
  ];

  var opts = ['Пицца', 'Суши', 'Шаурма'];
  var used = [];
  var noRepeat = false;
  var pal = 'graphite';
  var busy = false;
  var winIdx = -1;

  function $(id) { return document.getElementById(id); }
  var inp = $('inp'), chips = $('chips'), count = $('count'), go = $('go'), res = $('res'),
      val = $('val'), label = $('label'), hint = $('hint'), clearBtn = $('clear'), norep = $('norep'), palsEl = $('pals');

  function strings(a) { return Array.isArray(a) ? a.filter(function (s) { return typeof s === 'string'; }).slice(0, MAX) : null; }

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var o = JSON.parse(raw);
      if (o && strings(o.opts)) opts = strings(o.opts);
      if (o && strings(o.used)) used = strings(o.used);
      if (o && o.noRepeat === true) noRepeat = true;
      if (o && typeof o.pal === 'string') pal = o.pal;
    } else {
      var old = strings(JSON.parse(localStorage.getItem(OLD_KEY)));
      if (old) opts = old;
    }
  } catch (e) {}
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ opts: opts, used: used, noRepeat: noRepeat, pal: pal })); } catch (e) {}
  }

  function plural(n) {
    var a = n % 10, b = n % 100;
    if (a === 1 && b !== 11) return 'вариант';
    if (a >= 2 && a <= 4 && (b < 12 || b > 14)) return 'варианта';
    return 'вариантов';
  }
  function rand(n) {
    var buf = new Uint32Array(1);
    try { crypto.getRandomValues(buf); return buf[0] % n; } catch (e) { return Math.floor(Math.random() * n); }
  }
  function isUsed(t) { return used.indexOf(t) >= 0; }
  function remaining() { return opts.filter(function (t) { return !isUsed(t); }).length; }

  // Цвета
  function applyPal() {
    var p = PALS.filter(function (x) { return x.id === pal; })[0] || PALS[0];
    var r = document.documentElement.style;
    r.setProperty('--h', p.h); r.setProperty('--s', p.s); r.setProperty('--ah', p.ah);
    Array.prototype.forEach.call(palsEl.children, function (b) { b.setAttribute('aria-pressed', b.dataset.id === p.id ? 'true' : 'false'); });
  }
  PALS.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pal'; b.dataset.id = p.id;
    b.style.setProperty('--sw', p.ah);
    b.setAttribute('aria-label', 'Цвет: ' + p.name);
    b.addEventListener('click', function () { pal = p.id; applyPal(); save(); });
    palsEl.appendChild(b);
  });

  function render() {
    chips.textContent = '';
    opts.forEach(function (t, i) {
      var c = document.createElement('div');
      c.className = 'chip';
      if (i === winIdx) c.dataset.win = '1';
      else if (noRepeat && isUsed(t)) c.dataset.used = '1';
      var s = document.createElement('span');
      s.textContent = t;
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Убрать вариант ' + t);
      b.addEventListener('click', function () {
        if (busy) return;
        used = used.filter(function (u) { return u !== t; });
        opts.splice(i, 1); winIdx = -1; reset(); save(); render();
      });
      c.appendChild(s); c.appendChild(b);
      chips.appendChild(c);
    });
    if (!opts.length) count.textContent = 'Пока пусто. Добавьте хотя бы два варианта.';
    else if (noRepeat && used.length) count.textContent = opts.length + ' ' + plural(opts.length) + ', осталось ' + remaining();
    else count.textContent = opts.length + ' ' + plural(opts.length);
    clearBtn.hidden = opts.length === 0;
    norep.setAttribute('aria-checked', noRepeat ? 'true' : 'false');
    go.disabled = busy || opts.length < 2;
  }

  function reset() {
    res.dataset.state = 'idle'; label.textContent = 'Результат'; hint.textContent = '';
    val.textContent = opts.length < 2 ? 'Нужно минимум два варианта' : 'Нажмите «Выбрать»';
    go.textContent = 'Выбрать';
  }

  function add(text) {
    text = text.replace(/\s+/g, ' ').trim();
    if (!text || opts.length >= MAX) return;
    var low = text.toLowerCase();
    if (opts.some(function (o) { return o.toLowerCase() === low; })) return;
    opts.push(text); winIdx = -1; save(); render();
    if (res.dataset.state !== 'spin') reset();
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    add(inp.value);
    inp.value = '';
    inp.focus();
  });

  clearBtn.addEventListener('click', function () {
    if (busy) return;
    opts = []; used = []; winIdx = -1; save(); reset(); render();
  });

  norep.addEventListener('click', function () {
    if (busy) return;
    noRepeat = !noRepeat;
    used = [];
    winIdx = -1;
    save(); reset(); render();
  });

  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cycled = false;

  function finish(w) {
    busy = false; winIdx = w;
    var t = opts[w];
    if (noRepeat) used.push(t);
    save();
    res.dataset.state = 'done'; label.textContent = 'Выпало';
    val.textContent = t;
    go.textContent = 'Выбрать ещё раз';
    var msg = '';
    if (cycled) msg = 'Все варианты уже выпадали, начался новый круг. ';
    if (noRepeat) {
      var left = remaining();
      msg += left > 0 ? 'Осталось в круге: ' + left + '.' : 'Это был последний, дальше новый круг.';
    }
    hint.textContent = msg.trim();
    render();
  }

  go.addEventListener('click', function () {
    if (busy || opts.length < 2) return;
    var pool = [];
    opts.forEach(function (t, i) { if (!noRepeat || !isUsed(t)) pool.push(i); });
    cycled = false;
    if (!pool.length) {
      used = []; cycled = true;
      opts.forEach(function (t, i) { pool.push(i); });
    }
    var w = pool[rand(pool.length)];
    winIdx = -1; busy = true; hint.textContent = ''; render();
    if (reduce) { finish(w); return; }
    res.dataset.state = 'spin'; label.textContent = 'Выбираю…';
    var step = 0, total = 16, prev = -1;
    (function tick() {
      if (step >= total) { finish(w); return; }
      var i = rand(opts.length);
      if (i === prev) i = (i + 1) % opts.length;
      prev = i;
      val.textContent = opts[i];
      step++;
      setTimeout(tick, 50 + step * step * 0.8);
    })();
  });

  applyPal();
  reset();
  render();
})();
</script>

</body></html>
